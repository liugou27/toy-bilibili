# 容器模式 broker 配置:brokerIP1 指向自身服务名,供 compose 网络内客户端使用。
# 宿主机直跑服务时请改用 deploy/rocketmq/broker.conf(brokerIP1=127.0.0.1)。
brokerClusterName = ToysVideoCluster
brokerName = broker-a
brokerId = 0
brokerIP1 = rocketmq-broker
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
