# ---------------------------------------------------------------------------
# 配置优先级: Nacos(common.yml / toys-gateway.yml, 由 deploy/nacos-init.sh 初始化)
#   > 环境变量 > 本文件默认值。本地开发不配 Nacos 也能用本文件默认值跑通;
#   部署新环境: 先执行 deploy/nacos-init.sh, 再到 Nacos 控制台改标了【部署】的项。
# ---------------------------------------------------------------------------

server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: toys-gateway
  lifecycle:
    timeout-per-shutdown-phase: 30s
  config:
    import:
      - optional:nacos:common.yml
      - optional:nacos:toys-gateway.yml
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}   # 【部署】Redis(限流/令牌黑名单)
      port: 6379
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}   # 【部署】Nacos 注册/配置中心地址
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000
            response-timeout: 300s
            pool:
              max-idle-time: 30s
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns: ${toys.cors.origins:http://localhost:5173}
                allowed-methods: "*"
                allowed-headers: "*"
                exposed-headers: X-Request-Id
                allow-credentials: true
          routes:
            - id: internal-blocked
              uri: http://127.0.0.1:9
              predicates:
                - Path=/internal/**
            - id: user-service
              uri: lb://toys-user-service
              predicates:
                - Path=/api/auth/**,/api/users/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@userKeyResolver}"
            - id: video-service
              uri: lb://toys-video-service
              predicates:
                - Path=/api/videos/**,/api/my/videos/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 50
                    redis-rate-limiter.burstCapacity: 100
                    key-resolver: "#{@userKeyResolver}"
            - id: moderation-service
              uri: lb://toys-moderation-service
              predicates:
                - Path=/api/admin/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    key-resolver: "#{@userKeyResolver}"
            - id: media-proxy
              uri: lb://toys-video-service
              predicates:
                - Path=/media/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 100
                    redis-rate-limiter.burstCapacity: 200
                    key-resolver: "#{@userKeyResolver}"

toys:
  jwt:
    secret: toys-video-dev-secret-key-change-me-in-prod!  # 【部署】生产必换强随机值,与 user-service 一致
  cors:
    origins: http://localhost:5173  # 【部署】前端来源,生产改实际域名

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
