server:
  port: 8103
  shutdown: graceful

spring:
  application:
    name: toys-moderation-service
  config:
    import:
      - optional:nacos:common.yml
      - optional:nacos:toys-moderation-service.yml
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    openfeign:
      circuitbreaker:
        enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/toys_video?currentSchema=moderation_db
    username: postgres
    password: ""
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      max-lifetime: 1800000
  flyway:
    enabled: true
    default-schema: moderation_db
    schemas: moderation_db

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

rocketmq:
  name-server: ${ROCKETMQ_ADDR:127.0.0.1:9876}
  consumer:
    # 消费重试 16 次约 4.6h 后进死信;拉取间隔与批次保持默认
    pull-batch-size: 16

toys:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: minioadmin
    secret-key: minioadmin
  scripts:
    dir: ${TOYS_SCRIPTS_DIR:/Users/dsy/Desktop/dev/works/toys/scripts}
    python-bin: python3

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
