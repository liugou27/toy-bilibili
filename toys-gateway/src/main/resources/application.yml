server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: toys-gateway
  lifecycle:
    timeout-per-shutdown-phase: 30s
  config:
    import:
      - optional:nacos:common.yml
      - optional:nacos:toys-gateway.yml
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000
            response-timeout: 300s
            pool:
              max-idle-time: 30s
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns: ${toys.cors.origins:http://localhost:5173}
                allowed-methods: "*"
                allowed-headers: "*"
                exposed-headers: X-Request-Id
                allow-credentials: true
          routes:
            - id: internal-blocked
              uri: http://127.0.0.1:9
              predicates:
                - Path=/internal/**
            - id: user-service
              uri: lb://toys-user-service
              predicates:
                - Path=/api/auth/**,/api/users/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@userKeyResolver}"
            - id: video-service
              uri: lb://toys-video-service
              predicates:
                - Path=/api/videos/**,/api/my/videos/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 50
                    redis-rate-limiter.burstCapacity: 100
                    key-resolver: "#{@userKeyResolver}"
            - id: moderation-service
              uri: lb://toys-moderation-service
              predicates:
                - Path=/api/admin/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    key-resolver: "#{@userKeyResolver}"
            - id: minio-media
              uri: http://127.0.0.1:9000
              predicates:
                - Path=/media/**
              filters:
                - RewritePath=/media/(?<segment>.*), /$\{segment}

toys:
  jwt:
    secret: toys-video-dev-secret-key-change-me-in-prod!
  cors:
    origins: http://localhost:5173

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
