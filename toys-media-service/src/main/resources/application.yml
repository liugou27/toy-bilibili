server:
  port: 8104
  shutdown: graceful

spring:
  application:
    name: toys-media-service
  config:
    import:
      - optional:nacos:common.yml
      - optional:nacos:toys-media-service.yml
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    openfeign:
      circuitbreaker:
        enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/toys_video?currentSchema=media_db
    username: postgres
    password: ""
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      max-lifetime: 1800000
  flyway:
    enabled: true
    default-schema: media_db
    schemas: media_db
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

rocketmq:
  name-server: ${ROCKETMQ_ADDR:127.0.0.1:9876}

toys:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_AK:minioadmin}
    secret-key: ${MINIO_SK:minioadmin}
  scripts:
    dir: ${TOYS_SCRIPTS_DIR:/Users/dsy/Desktop/dev/works/toys/scripts}
    python-bin: python3
  transcode:
    lease-seconds: 90
    heartbeat-seconds: 30
    reap-interval-ms: 30000

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
