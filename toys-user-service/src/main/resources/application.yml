server:
  port: 8101
  shutdown: graceful

spring:
  application:
    name: toys-user-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  config:
    import:
      - optional:nacos:common.yml
      - optional:nacos:toys-user-service.yml
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/toys_video?currentSchema=user_db
    username: postgres
    password: ""
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      max-lifetime: 1800000
  flyway:
    enabled: true
    default-schema: user_db
    schemas: user_db

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

toys:
  jwt:
    secret: toys-video-dev-secret-key-change-me-in-prod!
    ttl-seconds: 604800

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
